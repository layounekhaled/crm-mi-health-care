name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment
        run: |
          curl -s -m 120 -X GET \
            "http://156.67.26.104:8000/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&token=${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" || echo "Deploy trigger sent"
